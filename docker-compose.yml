# MailCorgi: a self-hosted newsletter app.
#
#   Try it:          docker compose up -d                  -> http://localhost:3000
#   Run with HTTPS:  set DOMAIN and APP_URL in .env, then
#                    docker compose --profile https up -d   -> https://your-domain
services:
  mailcorgi:
    build: .
    image: mailcorgi:latest
    restart: unless-stopped
    environment:
      # The public address of this install. Used for links in emails and for secure cookies.
      APP_URL: ${APP_URL:-http://localhost:3000}
      # "true" turns on open sign-up with emailed codes, plans and billing.
      CLOUD: ${CLOUD:-}
      # Comma-separated install admins and, on self-hosted, who may sign up.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    volumes:
      - mailcorgi-data:/data
    ports:
      # Only this machine can reach the port by default. Caddy (below) serves the public side.
      - "${BIND:-127.0.0.1}:${PORT:-3000}:3000"

  # Automatic HTTPS with Let's Encrypt, plus on-demand certificates for custom website hosts.
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [mailcorgi]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mailcorgi-data:
  caddy-data:
  caddy-config:
